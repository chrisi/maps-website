server {
    listen 80;
    server_name localhost;

    # Root location redirects to your subpath if preferred, or handles general assets
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Specifically handle the subpath logic if your assets are requested with this prefix
    location /maps-website/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Ensure JS modules have the correct MIME type
    include /etc/nginx/mime.types;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
